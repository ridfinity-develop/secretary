<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RiD FINITY AI OFFICE</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary-color: #06C755;
      --primary-hover: #05b34c;
      --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* ขยายพื้นที่ด้านข้าง (Padding) ให้กว้างเต็มจอมากยิ่งขึ้น */
      padding: 24px 14px;
    }

    .form-container {
      flex-grow: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }

    .badge {
      display: inline-block;
      background: #e6f9ed;
      color: var(--primary-color);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header h2 {
      color: var(--text-main);
      font-size: 1.4rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    label i {
      color: var(--primary-color);
    }

    /* ขยายความกว้างกล่องเลือกรายชื่อให้เต็มจอและสูงขึ้นเพื่อความสบายตา */
    .custom-select-box {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-select-box:active {
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    /* ปรับแต่งกล่องรายการเมนูยืดออกกว้างสุดขอบจอ */
    .dropdown-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }

    .dropdown-item {
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:active, .dropdown-item.selected {
      background: #e6f9ed;
      color: var(--primary-color);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      resize: none;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      animation: popup 0.25s ease-out;
    }

    @keyframes popup {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 50px;
      height: 50px;
      background: #fef2f2;
      color: var(--danger-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-retry {
      background: var(--warning-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-close {
      background: #f1f5f9;
      color: var(--text-main);
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="form-container">
      <div class="header">
        <span class="badge">// RiD FINITY AI OFFICE //</span>
        <h2>มอบหมายงานพนักงาน</h2>
      </div>

      <div class="form-group">
        <label for="employee"><i class="fa-solid fa-user-gear"></i> มอบหมายงานให้</label>
        
        <!-- Custom Dropdown Container -->
        <div class="custom-select-box" id="select-box" onclick="toggleDropdown()">
          <span id="selected-text" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">กำลังโหลดรายชื่อพนักงาน...</span>
          <i class="fa-solid fa-chevron-down" id="dropdown-icon" style="color: var(--text-muted); font-size: 0.85rem; transition: transform 0.2s;"></i>
        </div>
        
        <div class="dropdown-list" id="dropdown-list">
          <!-- รายชื่อจะถูกเติมเข้ามาตรงนี้ด้วย JavaScript -->
        </div>
      </div>

      <div class="form-group">
        <label for="command"><i class="fa-solid fa-terminal"></i> ให้ทำตามคำสั่งนี้</label>
        <textarea id="command" placeholder="พิมพ์รายละเอียดคำสั่งงานที่นี่..."></textarea>
      </div>
    </div>

    <button class="btn-submit" onclick="submitForm()">
      <div class="spinner" id="btn-spinner"></div>
      <i class="fa-solid fa-paper-plane" id="btn-icon"></i>
      <span id="btn-text">คุณเลขา ดำเนินการให้หน่อย</span>
    </button>
  </div>

  <!-- Error Modal -->
  <div class="modal-overlay" id="error-modal">
    <div class="modal-box">
      <div class="modal-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <div class="modal-title">ส่งข้อความไม่สำเร็จ</div>
      <div class="modal-desc">ไม่สามารถส่งคำสั่งเข้าแชทได้ กรุณาลองใหม่อีกครั้ง</div>
      <div class="btn-group">
        <button class="btn-retry" onclick="submitForm()"><i class="fa-solid fa-rotate-right"></i> สั่งการใหม่อีกครั้ง</button>
        <button class="btn-close" onclick="closeForm()">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

  <script>
    // Config: นำค่าของคุณมาวางตรงนี้
    const MY_LIFF_ID = "2012248473-7PwD4Fab"; // LIFF ID จาก LINE Login Channel
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzywfePqO206gfRe1ginXBKu4Mb6AeVQoaQh41jN0Q3I5XWGdR4RYNPlzqbS7IzzDGv/exec"; // Web App URL จาก Google Apps Script

    let selectedEmployeeValue = "";

    window.onload = function() {
      // 1. Init LIFF
      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          }
        })
        .catch(err => console.error("LIFF Init Error:", err));

      // 2. Fetch Employee names from GAS API
      fetchEmployeeNames();

      // ปิด Dropdown เมื่อคลิกพื้นที่นอกกล่อง
      document.addEventListener("click", function(e) {
        if (!document.getElementById("select-box").contains(e.target) && !document.getElementById("dropdown-list").contains(e.target)) {
          closeDropdown();
        }
      });
    };

    function toggleDropdown() {
      const list = document.getElementById("dropdown-list");
      const icon = document.getElementById("dropdown-icon");
      if (list.style.display === "block") {
        closeDropdown();
      } else {
        list.style.display = "block";
        icon.style.transform = "rotate(180deg)";
      }
    }

    function closeDropdown() {
      document.getElementById("dropdown-list").style.display = "none";
      document.getElementById("dropdown-icon").style.transform = "rotate(0deg)";
    }

    function fetchEmployeeNames() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
          const listContainer = document.getElementById("dropdown-list");
          const selectedText = document.getElementById("selected-text");
          listContainer.innerHTML = "";
          
          if (!data.employees || data.employees.length === 0) {
            selectedText.textContent = "-- ไม่พบข้อมูลพนักงาน --";
            return;
          }

          // เลือกชื่อแรกเป็นค่าเริ่มต้น
          selectedEmployeeValue = data.employees[0];
          selectedText.textContent = selectedEmployeeValue;

          data.employees.forEach((name, index) => {
            const item = document.createElement("div");
            item.className = "dropdown-item" + (index === 0 ? " selected" : "");
            item.textContent = name;
            item.onclick = function() {
              selectedEmployeeValue = name;
              selectedText.textContent = name;
              
              // อัปเดตสถานะเลือก
              document.querySelectorAll(".dropdown-item").forEach(el => el.classList.remove("selected"));
              item.classList.add("selected");
              
              closeDropdown();
            };
            listContainer.appendChild(item);
          });
        })
        .catch(err => {
          console.error("Fetch Error:", err);
          document.getElementById("selected-text").textContent = "-- โหลดข้อมูลล้มเหลว --";
        });
    }

    function submitForm() {
      document.getElementById("error-modal").style.display = "none";
      
      const emp = selectedEmployeeValue;
      const cmd = document.getElementById("command").value.trim();

      if (!emp) {
        alert("กรุณาเลือกรายชื่อพนักงาน");
        return;
      }
      if (!cmd) {
        alert("กรุณาพิมพ์คำสั่งงาน");
        return;
      }

      setLoading(true);

      const messageText = `// RiD FINITY AI OFFICE //\n[${emp}]\n${cmd}`;

      if (liff.isInClient()) {
        liff.sendMessages([
          {
            type: 'text',
            text: messageText
          }
        ]).then(() => {
          setLoading(false);
          liff.closeWindow();
        }).catch((err) => {
          console.error("Send Message Error:", err);
          setLoading(false);
          document.getElementById("error-modal").style.display = "flex";
        });
      } else {
        setLoading(false);
        alert("ระบบนี้รองรับการเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
      }
    }

    function setLoading(isLoading) {
      const spinner = document.getElementById("btn-spinner");
      const icon = document.getElementById("btn-icon");
      const text = document.getElementById("btn-text");

      if (isLoading) {
        spinner.style.display = "block";
        icon.style.display = "none";
        text.textContent = "กำลังส่งข้อมูล...";
      } else {
        spinner.style.display = "none";
        icon.style.display = "inline-block";
        text.textContent = "คุณเลขา ดำเนินการให้หน่อย";
      }
    }

    function closeForm() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
