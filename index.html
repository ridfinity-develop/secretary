<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiD FINITY AI OFFICE</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary-color: #06C755;
      --primary-hover: #05b34c;
      --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background: #e6f9ed;
      color: var(--primary-color);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header h2 {
      color: var(--text-main);
      font-size: 1.35rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    label i {
      color: var(--primary-color);
    }

    .select-wrapper {
      position: relative;
    }

    select, textarea {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 36px;
    }

    .select-wrapper::after {
      content: "\f0d7";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    textarea {
      height: 110px;
      resize: none;
      line-height: 1.5;
    }

    select:focus, textarea:focus {
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      animation: popup 0.25s ease-out;
    }

    @keyframes popup {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 50px;
      height: 50px;
      background: #fef2f2;
      color: var(--danger-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin: 0 auto 12px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-retry {
      background: var(--warning-color);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-close {
      background: #f1f5f9;
      color: var(--text-main);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #fff;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="badge">// RiD FINITY AI OFFICE //</span>
      <h2>มอบหมายงานพนักงาน</h2>
    </div>

    <div class="form-group">
      <label for="employee"><i class="fa-solid fa-user-gear"></i> มอบหมายงานให้</label>
      <div class="select-wrapper">
        <select id="employee">
          <option value="">กำลังโหลดรายชื่อพนักงาน...</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="command"><i class="fa-solid fa-terminal"></i> ให้ทำตามคำสั่งนี้</label>
      <textarea id="command" placeholder="พิมพ์รายละเอียดคำสั่งงานที่นี่..."></textarea>
    </div>

    <button class="btn-submit" onclick="submitForm()">
      <div class="spinner" id="btn-spinner"></div>
      <i class="fa-solid fa-paper-plane" id="btn-icon"></i>
      <span id="btn-text">คุณเลขา ดำเนินการให้หน่อย</span>
    </button>
  </div>

  <!-- Error Modal -->
  <div class="modal-overlay" id="error-modal">
    <div class="modal-box">
      <div class="modal-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <div class="modal-title">ส่งข้อความไม่สำเร็จ</div>
      <div class="modal-desc">ไม่สามารถส่งคำสั่งเข้าแชทได้ กรุณาลองใหม่อีกครั้ง</div>
      <div class="btn-group">
        <button class="btn-retry" onclick="submitForm()"><i class="fa-solid fa-rotate-right"></i> สั่งการใหม่อีกครั้ง</button>
        <button class="btn-close" onclick="closeForm()">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

  <script>
    // Config: นำค่าจากระบบของคุณมาวางตรงนี้
    const MY_LIFF_ID = "YOUR_LIFF_ID"; // LIFF ID จาก LINE Login Channel
    const GAS_API_URL = "YOUR_GAS_WEB_APP_URL"; // Web App URL จาก Google Apps Script

    window.onload = function() {
      // 1. Init LIFF
      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          }
        })
        .catch(err => console.error("LIFF Init Error:", err));

      // 2. Fetch Employee names from GAS API
      fetchEmployeeNames();
    };

    function fetchEmployeeNames() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
          const select = document.getElementById("employee");
          select.innerHTML = "";
          
          if (!data.employees || data.employees.length === 0) {
            select.innerHTML = '<option value="">-- ไม่พบข้อมูลพนักงาน --</option>';
            return;
          }

          data.employees.forEach(name => {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            select.appendChild(option);
          });
        })
        .catch(err => {
          console.error("Fetch Error:", err);
          document.getElementById("employee").innerHTML = '<option value="">-- โหลดข้อมูลล้มเหลว --</option>';
        });
    }

    function submitForm() {
      document.getElementById("error-modal").style.display = "none";
      
      const emp = document.getElementById("employee").value;
      const cmd = document.getElementById("command").value.trim();

      if (!emp) {
        alert("กรุณาเลือกรายชื่อพนักงาน");
        return;
      }
      if (!cmd) {
        alert("กรุณาพิมพ์คำสั่งงาน");
        return;
      }

      setLoading(true);

      const messageText = `// RiD FINITY AI OFFICE //\n[${emp}]\n${cmd}`;

      if (liff.isInClient()) {
        liff.sendMessages([
          {
            type: 'text',
            text: messageText
          }
        ]).then(() => {
          setLoading(false);
          liff.closeWindow();
        }).catch((err) => {
          console.error("Send Message Error:", err);
          setLoading(false);
          document.getElementById("error-modal").style.display = "flex";
        });
      } else {
        setLoading(false);
        alert("ระบบนี้รองรับการเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
      }
    }

    function setLoading(isLoading) {
      const spinner = document.getElementById("btn-spinner");
      const icon = document.getElementById("btn-icon");
      const text = document.getElementById("btn-text");

      if (isLoading) {
        spinner.style.display = "block";
        icon.style.display = "none";
        text.textContent = "กำลังส่งข้อมูล...";
      } else {
        spinner.style.display = "none";
        icon.style.display = "inline-block";
        text.textContent = "คุณเลขา ดำเนินการให้หน่อย";
      }
    }

    function closeForm() {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
